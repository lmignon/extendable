---
# Release a new version of the library:
# - compute the new version from the latest tag and the requested bump;
# - update the changelog from the news fragments (towncrier);
# - commit the changelog and tag the release (the version of the package is
#   computed from the tag by hatch-vcs);
# - build and publish the package to PyPI;
# - create the GitHub release with the changelog of the version as notes.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Part of the version to increase (major.minor.patch)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Update the changelog and tag the release
    # releases are only made from the default branch
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # the release must be approved before anything is pushed (required
    # reviewers of the environment). The "release" environment of the pypi job
    # can't be used here: it would require a second approval.
    environment: release-approval
    permissions:
      # push the changelog and the tag
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous-version: ${{ steps.version.outputs.previous-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the tags are required to compute the version
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0

      - name: Compute the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git describe --tags --abbrev=0 --match '[0-9]*' 2>/dev/null || echo "0.0.0")
          version=$(uvx --from semver pysemver bump "$BUMP" "$latest")
          echo "Releasing $version (latest release: $latest)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous-version=$latest" >> "$GITHUB_OUTPUT"

      - name: Update the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # the section of the version is used as notes of the GitHub release,
          # if there are news fragments (the notes generated by GitHub are
          # always added)
          touch "$RUNNER_TEMP/notes.md"
          if [ -n "$(find news -type f ! -name .gitignore)" ]; then
            uvx towncrier build --draft --version "$VERSION" > "$RUNNER_TEMP/notes.md"
          fi
          uvx towncrier build --yes --version "$VERSION"

      - name: Commit the changelog and tag the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "refs/tags/$VERSION"

      - name: Build the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv build
          # the version computed from the tag must be the released one
          ls dist/*-"$VERSION"-*.whl dist/*-"$VERSION".tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md

  pypi:
    name: Publish the package to PyPI
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/extendable/${{ needs.prepare.outputs.version }}/
    permissions:
      # authenticate to PyPI via OIDC (trusted publishing)
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub release
    needs: [prepare, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_VERSION: ${{ needs.prepare.outputs.previous-version }}
        run: |
          # the notes of towncrier are followed by the notes generated by
          # GitHub (merged pull requests, new contributors and link to the
          # full changelog since the previous version)
          options=()
          if [ "$PREVIOUS_VERSION" != "0.0.0" ]; then
            options=(--notes-start-tag "$PREVIOUS_VERSION")
          fi
          gh release create "$VERSION" artifacts/dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes-file artifacts/notes/notes.md \
            --generate-notes \
            "${options[@]}" \
            --verify-tag
