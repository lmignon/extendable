---
# Release a new version of the library:
# - prepare (no write access): compute the new version from the latest tag and
#   the requested bump, update the changelog from the news fragments
#   (towncrier), commit and tag the release locally (the version of the package
#   is computed from the tag by hatch-vcs), build the package and show the
#   release notes into the summary of the run;
# - release (requires the approval of the reviewers of the "release"
#   environment): push the commit and the tag, publish the package to PyPI;
# - github-release: create the GitHub release.
# Nothing is pushed nor published before the approval.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Part of the version to increase (major.minor.patch)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the release
    # releases are only made from the default branch
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous-version: ${{ steps.version.outputs.previous-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the tags are required to compute the version
          fetch-depth: 0
          # nothing is pushed by this job
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Compute the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git describe --tags --abbrev=0 --match '[0-9]*' 2>/dev/null || echo "0.0.0")
          version=$(uvx --from semver pysemver bump "$BUMP" "$latest")
          echo "Releasing $version (latest release: $latest)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous-version=$latest" >> "$GITHUB_OUTPUT"

      - name: Update the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          # the section of the version is used as notes of the GitHub release,
          # if there are news fragments (the notes generated by GitHub are
          # always added)
          touch "$RUNNER_TEMP/release/notes.md"
          if [ -n "$(find news -type f ! -name .gitignore)" ]; then
            uvx towncrier build --draft --version "$VERSION" > "$RUNNER_TEMP/release/notes.md"
          fi
          uvx towncrier build --yes --version "$VERSION"

      - name: Commit and tag the release locally
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          # the commit and the tag are pushed by the release job, once approved
          git bundle create "$RUNNER_TEMP/release/release.bundle" "refs/tags/$VERSION" ^HEAD~1

      - name: Build the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv build
          # the version computed from the tag must be the released one
          ls dist/*-"$VERSION"-*.whl dist/*-"$VERSION".tar.gz

      - name: Show the release notes to review
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous-version }}
        run: |
          {
            echo "# Release $VERSION (previous version: $PREVIOUS_VERSION)"
            echo
            echo "Packages:"
            echo
            for file in dist/*; do echo "- \`$(basename "$file")\`"; done
            echo
            echo "## Notes"
            echo
            if [ -s "$RUNNER_TEMP/release/notes.md" ]; then
              cat "$RUNNER_TEMP/release/notes.md"
            else
              echo "_No news fragment: only the notes generated by GitHub._"
            fi
            echo
            echo "The notes generated by GitHub (merged pull requests, link to the"
            echo "full changelog) are added when the GitHub release is created."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/

  release:
    name: Push the release and publish it to PyPI
    needs: prepare
    runs-on: ubuntu-latest
    # the release must be approved by the required reviewers of the
    # environment, after the review of the summary of the prepare job
    environment:
      name: release
      url: https://pypi.org/project/extendable/${{ needs.prepare.outputs.version }}/
    permissions:
      # push the changelog and the tag
      contents: write
      # authenticate to PyPI via OIDC (trusted publishing)
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the parent of the release commit is required to fetch the bundle
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Push the commit and the tag of the release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git fetch "$RUNNER_TEMP/release/release.bundle" "refs/tags/$VERSION:refs/tags/$VERSION"
          commit=$(git rev-parse "refs/tags/$VERSION^{commit}")
          # rejected if the branch has changed since the preparation: run the
          # workflow again
          git push --atomic origin "$commit:refs/heads/$GITHUB_REF_NAME" "refs/tags/$VERSION"

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create the GitHub release
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_VERSION: ${{ needs.prepare.outputs.previous-version }}
        run: |
          # the notes of towncrier are followed by the notes generated by
          # GitHub (merged pull requests, new contributors and link to the
          # full changelog since the previous version)
          options=()
          if [ "$PREVIOUS_VERSION" != "0.0.0" ]; then
            options=(--notes-start-tag "$PREVIOUS_VERSION")
          fi
          gh release create "$VERSION" artifacts/dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes-file artifacts/release/notes.md \
            --generate-notes \
            "${options[@]}" \
            --verify-tag
