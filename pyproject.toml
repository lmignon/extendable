[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "extendable"
description = "A lib to define class extendable at runtime."
authors = [{name = "Laurent Mignon", email = "laurent.mignon@acsone.eu"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
dynamic = ["version"]
dependencies = []
requires-python = ">=3.10"

[dependency-groups]
# development tools: not published into the metadata of the package
test = [
    "pytest",
    "pytest-mock",
    "coverage[toml]",
]
typing = [
    "mypy",
]

[project.urls]
Source = "https://github.com/lmignon/extendable"
Changelog = "https://github.com/lmignon/extendable/blob/master/HISTORY.rst"

[tool.hatch.version]
# the version is computed from the git tags
source = "vcs"

[tool.hatch.build.targets.sdist]
exclude = [".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/extendable"]

[tool.ruff]
# keep the examples of the documentation as written (e.g. the "#>" outputs)
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.coverage.run]
branch = true
source_pkgs = ["extendable"]

[tool.coverage.paths]
source = ["src", ".tox/*/site-packages"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
]

[tool.towncrier]
name = "Extendable"
filename = "HISTORY.rst"
directory = "news"
issue_format = "`#{issue} <https://github.com/lmignon/extendable/issues/{issue}>`_"
title_format = "{version} ({project_date})"
